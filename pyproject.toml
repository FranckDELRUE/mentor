[project]
name = "mentor-socle"
version = "0.1.0"
description = "Socle commun des applications Mentor (Lettres, Maths, Histoire, SVT…) : configuration, IA locale, verrou GPU, base, tâches, scans, impression, pédagogie, interface parent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Usage privé" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "filelock>=3.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "segno>=1.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "zxing-cpp>=2.2",
    "typst>=0.12",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
vecteurs = ["sqlite-vec>=0.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mentor-socle = "mentor_socle.cli:main_socle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor_socle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --continue-on-collection-errors -p no:warnings"

[tool.ruff]
line-length = 110
target-version = "py312"
# Gabarit de Mentor : fichiers à marqueurs (__PAQUET__…), recopiés tels quels des assets.
extend-exclude = ["src/mentor_socle/gabarit_app"]
