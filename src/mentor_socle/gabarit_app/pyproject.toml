[project]
name = "__PROJET__"
version = "0.1.0"
description = "__NOM__ — professeur virtuel 100 % local, travail sur papier"
requires-python = ">=3.12"
dependencies = [
    "mentor-socle>=__VERSION_MIN__,<__VERSION_MAX__",
]

[project.scripts]
mentor = "__PAQUET__.__main__:run"

[tool.uv.sources]
# Le socle vit à côté, dans ../mentor-socle (dépôt Git séparé, versions taguées).
mentor-socle = { path = "../mentor-socle", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__PAQUET__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
